name: unecont

services:
  db:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: realworld
      POSTGRES_USER: realworld
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?configure POSTGRES_PASSWORD no .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U realworld -d realworld"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    image: unecont-migrate:local
    build:
      context: .
      target: migrate
    environment:
      DATABASE_URL: postgresql://realworld:${POSTGRES_PASSWORD}@db:5432/realworld?schema=public
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    image: unecont-api:local
    build:
      context: .
      target: runtime
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgresql://realworld:${POSTGRES_PASSWORD}@db:5432/realworld?schema=public
      JWT_SECRET: ${JWT_SECRET:?configure JWT_SECRET no .env}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5
    init: true
    restart: unless-stopped

volumes:
  postgres_data:
