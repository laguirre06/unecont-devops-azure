name: CI and GHCR

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Build lint tests and smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build validation image
        run: docker build --target build -t unecont-check:ci .

      - name: Lint infrastructure instrumentation
        # Existing upstream lint failures are outside this validation scope.
        run: |
          docker run --rm unecont-check:ci \
            npx --no-install eslint \
              src/main.ts \
              src/platform/observability.ts \
              src/tests/setup.ts \
              --max-warnings=0

      - name: Unit tests
        run: |
          docker run --rm -e NX_DAEMON=false unecont-check:ci \
            npx --no-install nx test api --runInBand

      - name: Generate ephemeral configuration
        run: |
          umask 077
          docker run --rm node:22-bookworm-slim \
            node -e 'const c=require("node:crypto"); console.log("POSTGRES_PASSWORD="+c.randomBytes(24).toString("hex")); console.log("JWT_SECRET="+c.randomBytes(48).toString("hex"));' \
            > .env

      - name: Build and start Compose
        run: |
          docker compose config --quiet
          docker compose --parallel 1 build
          docker compose up -d --wait --wait-timeout 120

      - name: Smoke test
        run: |
          curl --fail --silent --show-error http://localhost:3000/health/live
          curl --fail --silent --show-error http://localhost:3000/health/ready
          curl --fail --silent --show-error http://localhost:3000/api/tags
          curl --fail --silent --show-error http://localhost:3000/metrics |
            grep '^process_resident_memory_bytes'

      - name: Diagnostics on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --tail=100

      - name: Cleanup
        if: always()
        run: |
          docker compose down --volumes --remove-orphans
          rm -f .env

  publish:
    name: Publish GHCR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Login to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" |
            docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Build and publish API and migrations
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          IMAGE_BASE="ghcr.io/${REPOSITORY,,}"

          docker build --target runtime \
            --label "org.opencontainers.image.source=https://github.com/$REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            -t "$IMAGE_BASE:sha-$GITHUB_SHA" .

          docker build --target migrate \
            --label "org.opencontainers.image.source=https://github.com/$REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            -t "$IMAGE_BASE-migrate:sha-$GITHUB_SHA" .

          docker push "$IMAGE_BASE:sha-$GITHUB_SHA"
          docker push "$IMAGE_BASE-migrate:sha-$GITHUB_SHA"

          {
            echo "Published images:"
            echo "- $IMAGE_BASE:sha-$GITHUB_SHA"
            echo "- $IMAGE_BASE-migrate:sha-$GITHUB_SHA"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Logout
        if: always()
        run: docker logout ghcr.io
